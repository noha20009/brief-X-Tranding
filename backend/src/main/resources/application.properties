# ================================================================
# XTrade - Configuration de l'application
# ================================================================

# Nom de l'application
spring.application.name=xtrade-trading

# ---------------------- Base de donnees MySQL ----------------------
# Les valeurs sont injectées via des variables d'environnement avec un défaut.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/xtrade?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:nouha23}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------- JPA / Hibernate ----------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------- Serveur ----------------------
server.port=8081

# ---------------------- JSON ----------------------
# Format des dates dans les réponses JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------------------- Sécurité JWT ----------------------
# Clé secrète (base64, min 256 bits) et durée de vie du jeton
app.jwt.secret=${JWT_SECRET:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
